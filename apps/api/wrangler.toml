name = "vicuna-api"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
# Top-level key: must stay above the first [table], or TOML attaches it to that table and wrangler ignores it.
# The API shares the site's hostname under /api/*: the public site and staging (each picks its own database, see
# STAGING_HOST below). admin.vicuna-eg.com serves only the owner admin (ADR 0010), on its own origin, behind
# Cloudflare Access.
routes = [
  { pattern = "vicuna-eg.com/api/*", zone_name = "vicuna-eg.com" },
  { pattern = "staging.vicuna-eg.com/api/*", zone_name = "vicuna-eg.com" },
  { pattern = "admin.vicuna-eg.com", custom_domain = true },
]
# Reachable only through the routes above, where Cloudflare's rules (rate limiting, Access) apply.
workers_dev = false
preview_urls = false
# Keep variables added in the Cloudflare dashboard when GitHub deploys (otherwise a deploy replaces them with
# [vars] below). Secrets are always kept; this also protects plain-text ones added by mistake.
keep_vars = true

[vars]
# Exact origins allowed to POST from a browser. For local development put
# ALLOWED_ORIGINS="http://localhost:4321" in apps/api/.dev.vars (that file is git-ignored).
ALLOWED_ORIGINS = "https://vicuna-eg.com,https://www.vicuna-eg.com,https://staging.vicuna-eg.com"
# The only hostname that serves the admin. Not a secret.
ADMIN_HOST = "admin.vicuna-eg.com"
# Requests on this hostname use DB_STAGING (fail closed: without that binding they get 503, never the live DB).
STAGING_HOST = "staging.vicuna-eg.com"
# Meta dataset (Pixel) id for the Conversions API (src/meta.ts): public, the same id as the site's Pixel. The access
# token is a Secret named META_TOKEN (dashboard). Orders on staging reach Meta only as test events, when the
# dashboard variable META_TEST_EVENT_CODE holds the code from Events Manager > Test events.
META_PIXEL_ID = "2311877842998870"

[[d1_databases]]
binding = "DB"
database_name = "vicuna-db"
# D1 database id (an identifier, not a secret). Created in the Cloudflare dashboard.
database_id = "626197fa-3c59-48b3-944f-e2a2dd3978a0"
migrations_dir = "migrations"

# Staging has its own database, so test orders on staging.vicuna-eg.com never touch real orders or real stock.
# The Worker picks it by hostname (STAGING_HOST); the admin host and the live site always use DB above.
[[d1_databases]]
binding = "DB_STAGING"
database_name = "vicuna-db-staging"
database_id = "fba399ec-f29d-4776-b39d-7004ca0f8e54"
migrations_dir = "migrations"

# Rate limits per visitor (Workers Rate Limiting, counted per Cloudflare location). Orders take stock, so a flood
# of fake orders must not empty the shop: 5 orders a minute per address is far above what a real customer needs.
# Promo checks: 20 a minute, so codes cannot be guessed one after another. namespace_id is an account-unique number.
[[ratelimits]]
name = "ORDER_LIMIT"
namespace_id = "2101"

  [ratelimits.simple]
  limit = 5
  period = 60

[[ratelimits]]
name = "PROMO_LIMIT"
namespace_id = "2102"

  [ratelimits.simple]
  limit = 20
  period = 60

# Scheduled jobs (src/scheduled.ts, owner-approved 2026-10-17), both reported to the owner's Telegram chat:
#   "0 1 * * *"  every day at 01:00 UTC (03:00-04:00 Cairo): a JSON backup of the live database
#   "0 * * * *"  every hour: checks the home page, the belts page and /api/health; a message only when one fails
# Keep these strings equal to DAILY_BACKUP_CRON and HOURLY_WATCH_CRON in src/worker.ts.
[triggers]
crons = ["0 1 * * *", "0 * * * *"]
