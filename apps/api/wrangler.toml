name = "vicuna-api"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
# Top-level key: must stay above the first [table], or TOML attaches it to that table and wrangler ignores it.
# The API shares the site's hostname under /api/*. Production route is added at cutover.
# admin.vicuna-eg.com serves only the owner admin (ADR 0010), on its own origin, behind Cloudflare Access.
routes = [
  { pattern = "staging.vicuna-eg.com/api/*", zone_name = "vicuna-eg.com" },
  { pattern = "admin.vicuna-eg.com", custom_domain = true },
]
# Reachable only through the routes above, where Cloudflare's rules (rate limiting, Access) apply.
workers_dev = false
preview_urls = false
# Keep variables added in the Cloudflare dashboard when GitHub deploys (otherwise a deploy replaces them with
# [vars] below). Secrets are always kept; this also protects plain-text ones added by mistake.
keep_vars = true

[vars]
# Exact origins allowed to POST from a browser. For local development put
# ALLOWED_ORIGINS="http://localhost:4321" in apps/api/.dev.vars (that file is git-ignored).
ALLOWED_ORIGINS = "https://vicuna-eg.com,https://www.vicuna-eg.com,https://staging.vicuna-eg.com"
# The only hostname that serves the admin. Not a secret.
ADMIN_HOST = "admin.vicuna-eg.com"

[[d1_databases]]
binding = "DB"
database_name = "vicuna-db"
# D1 database id (an identifier, not a secret). Created in the Cloudflare dashboard.
database_id = "626197fa-3c59-48b3-944f-e2a2dd3978a0"
migrations_dir = "migrations"
