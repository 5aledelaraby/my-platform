# Static site served by Cloudflare (Workers static assets). Built by `astro build` into ./dist.
name = "vicuna-site"
# A small Worker runs before the assets only for the belts collection and the catalog feed (live stock, ADR 0013).
main = "src/worker.ts"
compatibility_date = "2026-10-01"
# Top-level key: must stay above the first [table], or TOML attaches it to that table and wrangler ignores it.
# Staging domain. Production (vicuna-eg.com) is added at cutover.
routes = [{ pattern = "staging.vicuna-eg.com", custom_domain = true }]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
# Every other path is served straight from the assets, without running the Worker.
run_worker_first = ["/collections/vicuna-belts/*", "/en/collections/vicuna-belts/*", "/catalog/products.csv"]

# The order API Worker, called directly (not over the internet) for GET /api/stock.
[[services]]
binding = "API"
service = "vicuna-api"
