# TEMPORARY: adds turbo to package.json and pnpm-lock.yaml on the setup-turborepo branch (the agent's sandbox cannot
# reach the npm registry), then checks that typecheck and the production build run through turbo.
# Delete this file once the lockfile commit exists.
name: turbo lockfile (temporary)

on:
  push:
    branches: [setup-turborepo]

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: pnpm add -D -w turbo@^2
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
        env:
          DEPLOY_ENV: production
      - run: pnpm build
        env:
          DEPLOY_ENV: production
      - name: Commit package.json and the lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git diff --cached --quiet && exit 0
          git commit -m "build: add turbo to the lockfile"
          git push
