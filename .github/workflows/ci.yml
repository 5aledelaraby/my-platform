name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Needs no installation: plain Node 22. Always runs. (App tests import workspace packages, so they run in `full`.)
  guards-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node tools/architecture/check-secrets.mjs
      - run: node tools/architecture/check-boundaries.mjs
      - run: node --test "packages/*/test/*.test.ts"

  # Full pipeline (needs the committed pnpm-lock.yaml).
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      # Builds and checks the production output (index,follow, sitemap). DEPLOY_ENV has no default on purpose.
      - run: pnpm build
        env:
          DEPLOY_ENV: production
      # The built site, kept 3 days so the pages can be reviewed (screenshots) without a local Astro install.
      - uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: apps/website/dist
          retention-days: 3
